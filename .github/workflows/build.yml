name: Kiểm thử và đóng gói

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      phat_hanh:
        description: "Tạo trang Release (thẻ v + phiên bản trong qlhd/__init__.py)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS (Apple Silicon)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Chạy kiểm thử
        run: python -m pytest -q

      - name: Đóng gói phần mềm Quản lý Hợp đồng
        run: |
          echo "APP_VERSION=$(python -c 'import qlhd; print(qlhd.__version__)')" >> "$GITHUB_ENV"
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name QuanLyHopDong --icon assets/icon.png \
            --exclude-module tkinter run_app.py

      - name: Đóng gói Phần mềm cấp mã (chỉ dùng tại nhà phát triển)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then MODE="--onefile"; else MODE="--onedir"; fi
          pyinstaller --noconfirm --windowed $MODE --paths . \
            --name CapMaBanQuyen --icon assets/icon.png \
            --exclude-module tkinter tools/license_manager.py

      - name: Chạy thử bản đóng gói
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -Command '$p = Start-Process -FilePath dist/QuanLyHopDong/QuanLyHopDong.exe -ArgumentList "--self-test" -Wait -PassThru; exit $p.ExitCode'
          else
            dist/QuanLyHopDong.app/Contents/MacOS/QuanLyHopDong --self-test
          fi

      - name: Tạo bộ cài đặt Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          New-Item -ItemType Directory -Force out | Out-Null
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$PWD\dist\QuanLyHopDong" "/DOutDir=$PWD\out" installer\QuanLyHopDong.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\CapMaBanQuyen.exe out\CapMaBanQuyen-Windows.exe

      - name: Cài thử như máy mới, chạy thử, gỡ cài đặt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out\QuanLyHopDong-CaiDat-Windows-*.exe).FullName
          $dir = "$env:RUNNER_TEMP\CaiThu"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Cài đặt lỗi: $($p.ExitCode)" }
          $env:QLHD_DATA_DIR = "$env:RUNNER_TEMP\DuLieuThu"
          $p = Start-Process -FilePath "$dir\QuanLyHopDong.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Bản đã cài chạy thử lỗi: $($p.ExitCode)" }
          $p = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Gỡ cài đặt lỗi: $($p.ExitCode)" }
          Get-ChildItem out

      - name: Tạo bộ cài đặt macOS (.dmg) và chạy thử
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmg
          cp -R dist/QuanLyHopDong.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "QuanLyHopDong" -srcfolder dmg -ov -format UDZO "out/QuanLyHopDong-macOS-$APP_VERSION.dmg"
          hdiutil attach "out/QuanLyHopDong-macOS-$APP_VERSION.dmg" -mountpoint /tmp/qlhd-dmg -nobrowse
          QLHD_DATA_DIR="$RUNNER_TEMP/dulieuthu" /tmp/qlhd-dmg/QuanLyHopDong.app/Contents/MacOS/QuanLyHopDong --self-test
          hdiutil detach /tmp/qlhd-dmg
          ditto -c -k --sequesterRsrc --keepParent dist/CapMaBanQuyen.app out/CapMaBanQuyen-macOS.zip
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: QuanLyHopDong-${{ runner.os }}
          path: out/QuanLyHopDong-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: CapMaBanQuyen-${{ runner.os }}-NOI-BO
          path: out/CapMaBanQuyen-*
          if-no-files-found: error

  release:
    name: Phát hành
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.phat_hanh)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xác định thẻ phiên bản
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('qlhd/__init__.py').read()).group(1))")
            echo "name=v$v" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: QuanLyHopDong-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Quản lý Hợp đồng ${{ steps.tag.outputs.name }}
          files: release/*
          generate_release_notes: true
